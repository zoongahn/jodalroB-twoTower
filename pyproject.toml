[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jodalrob-twotower"
version = "1.0.0"
description = "Two-Tower recommendation system with runtime package for jodalroB"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "jodalroB Team"}
]
keywords = ["recommendation", "two-tower", "deep-learning", "torchrec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "psycopg>=3.1.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "faiss-cpu>=1.7.4",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
torchrec = [
    "torchrec>=0.7.0",
    "fbgemm-gpu",
]
training = [
    "tensorboard>=2.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "polars>=0.20.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "runtime",
    "runtime.*",
    "database",
    "database.*"
]
exclude = [
    "tests*",
    "scripts*",
    "notebooks*",
    "docs*",
    "output*",
    "data*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.csv"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    ".",
]